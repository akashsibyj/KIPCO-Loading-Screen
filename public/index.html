<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4eef9">
  <title>KIPCO</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/kipco-logo.png" as="image">
  <link rel="stylesheet" href="src/kipco-loader.css">
  <style>
    html, body { margin: 0; height: 100%; background: #e4eef9; overflow: hidden; }
    html {
      -webkit-text-size-adjust: 100%;   /* stop iOS enlarging text on rotate */
      text-size-adjust: 100%;
    }
    body {
      overscroll-behavior: none;         /* no pull-to-refresh / bounce */
      -webkit-tap-highlight-color: transparent;
    }

    /* Animation size: 1 = fills the screen height, 0.55 = about half.
       It always stays centred, and the screen width always limits it,
       so it never overflows on narrow phones. */
    kipco-loader { --kl-size: 0.55; }                  /* desktop / laptop */

    @media (orientation: portrait) and (max-width: 600px) {
      kipco-loader { --kl-size: 0.45; }                /* phones held upright: smaller */
    }
    @media (orientation: landscape) and (max-height: 600px) {
      kipco-loader { --kl-size: 0.65; }                /* phones held sideways */
    }
  </style>
</head>
<body>
  <!-- Loading screen. The <img> is only shown if JavaScript is unavailable. -->
  <kipco-loader>
    <img src="assets/kipco-logo.png" alt="KIPCO">
  </kipco-loader>

  <script src="src/kipco-loader.js"></script>
</body>
</html>
